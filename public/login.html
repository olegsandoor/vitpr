<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <div class="auth-wrapper" id="authWrapper">
        <div class="brand-accent"></div>
        <div class="forms-viewport">
            <form class="auth-form active" id="loginForm">
                <h1 tabindex="-1">Вход в систему</h1>
                <div class="input-group"><input type="email" id="l_login" name="login" autocomplete="username" required placeholder=" " autofocus><label for="l_login">Рабочая почта</label></div>
                <div class="input-group"><input type="password" id="l_pass" name="password" autocomplete="current-password" required placeholder=" "><label for="l_pass">Пароль</label></div>
                <div id="loginServerMessage" class="server-message"></div>
                <button class="btn-main" type="submit">Войти</button>
                <div class="auth-help-row">
                    <button type="button" class="forgot-link" id="forgotPassBtn">Забыли пароль?</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/login.js" defer></script>
</body>
</html>
