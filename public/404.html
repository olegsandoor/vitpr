<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена · РУП «Витебскэнерго»</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:    #38bdf8;
            --bg-body:    #0f172a;
            --bg-elev:    #1e293b;
            --text-main:  #f8fafc;
            --text-muted: #94a3b8;
            --border:     #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.06), transparent 40%);
        }

        .nf-card {
            max-width: 540px;
            width: 100%;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 56px 40px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }

        .nf-code {
            font-size: 96px;
            font-weight: 800;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1;
        }

        .nf-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .nf-text {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        .nf-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nf-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.15s;
            background: transparent;
            color: var(--text-main);
            font-family: inherit;
        }
        .nf-btn:hover {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.06);
        }
        .nf-btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #0f172a;
            font-weight: 600;
        }
        .nf-btn-primary:hover {
            background: #0ea5e9;
            border-color: #0ea5e9;
        }

        .nf-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <main class="nf-card">
        <div class="nf-code">404</div>
        <h1 class="nf-title">Страница не найдена</h1>
        <p class="nf-text">
            Запрошенный адрес не существует или был перемещён.
            Проверьте ссылку или вернитесь на главную страницу системы.
        </p>
        <div class="nf-actions">
            <a href="/" class="nf-btn nf-btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"/></svg>
                На главную
            </a>
            <button type="button" class="nf-btn" id="nfBackBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Назад
            </button>
        </div>
        <div class="nf-footer">
            Информационная система согласования заявок · РУП «Витебскэнерго»
        </div>
    </main>
    <script src="/404.js" defer></script>
</body>
</html>
